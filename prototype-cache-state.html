<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bit-secret-hub 缓存状态原型</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #202124; background: #f5f6f7; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 20px; }
    main { max-width: 920px; margin: 0 auto; }
    h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: 0; }
    h2 { font-size: 18px; margin: 0 0 14px; letter-spacing: 0; }
    p { line-height: 1.6; color: #4a4f55; }
    section { margin-top: 24px; padding: 20px; border: 1px solid #d7dadd; border-radius: 6px; background: #fff; }
    .state { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
    .field { border-left: 3px solid #17746a; padding: 8px 12px; min-height: 68px; background: #f7faf9; }
    .label { display: block; color: #666; font-size: 12px; margin-bottom: 6px; }
    .value { font-weight: 650; overflow-wrap: anywhere; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    button { border: 1px solid #17746a; background: #fff; color: #115f57; border-radius: 5px; padding: 9px 12px; cursor: pointer; font: inherit; }
    button.primary { color: #fff; background: #17746a; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    .tabs { display: flex; gap: 6px; border-bottom: 1px solid #ddd; margin-bottom: 16px; }
    .tabs button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; }
    .tabs button.active { border-bottom-color: #17746a; font-weight: 700; }
    .notice { margin-top: 14px; padding: 10px 12px; background: #fff7df; border-left: 3px solid #b37700; color: #5e470c; }
    ol { padding-left: 22px; }
    li { margin: 10px 0; }
    code { font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
<main>
  <h1>bit-secret-hub 缓存状态原型</h1>
  <p>验证问题：profile 缓存面对正常刷新、离线、过期、远端删除和供应商验证失败时，是否始终给出明确且失败关闭的执行结果？本页只模拟状态，不保存或处理真实密钥。</p>

  <section>
    <h2>当前状态</h2>
    <div class="state" id="state"></div>
    <div class="notice" id="notice"></div>
  </section>

  <section>
    <h2>自由操作</h2>
    <div class="actions" id="actions"></div>
  </section>

  <section>
    <h2>引导场景</h2>
    <div class="tabs" id="tabs"></div>
    <p id="scenario-description"></p>
    <ol id="steps"></ol>
  </section>
</main>
<script>
  const initialState = () => ({ cache: "缺失", remote: "可用", validation: "通过", ageDays: null, executable: false, lastEvent: "尚未操作" });

  function reduce(state, action) {
    const next = { ...state, lastEvent: action };
    if (action === "刷新成功") return { ...next, cache: "有效", ageDays: 0, executable: true };
    if (action === "时间推进 8 天") {
      if (state.cache === "有效") return { ...next, cache: "过期", ageDays: 8, executable: false };
      return next;
    }
    if (action === "远端网络不可用") return { ...next, remote: "网络不可用", executable: state.cache === "有效" };
    if (action === "远端明确删除") return { ...next, remote: "Secret 缺失", cache: "已删除", ageDays: null, executable: false };
    if (action === "供应商验证失败") return { ...next, validation: "未验证", cache: "未验证", ageDays: 0, executable: false };
    if (action === "尝试执行") return { ...next, lastEvent: state.executable ? "执行获准" : "执行被拒绝" };
    if (action === "重置") return initialState();
    return next;
  }

  const actionNames = ["刷新成功", "时间推进 8 天", "远端网络不可用", "远端明确删除", "供应商验证失败", "尝试执行", "重置"];
  const scenarios = [
    { name: "正常与离线", description: "先刷新形成有效缓存，再模拟断网。未过 7 天的缓存仍可执行。", steps: ["刷新成功", "远端网络不可用", "尝试执行"] },
    { name: "缓存过期", description: "缓存超过 7 天后，即使文件还在，也必须拒绝离线执行。", steps: ["刷新成功", "时间推进 8 天", "尝试执行"] },
    { name: "远端删除", description: "BWS 明确缺少登记项时删除整个 profile 缓存，不能退回旧值。", steps: ["刷新成功", "远端明确删除", "尝试执行"] },
    { name: "验证失败", description: "BWS 已返回新值，但 GitHub 验证失败。缓存保留为未验证状态，禁止执行。", steps: ["刷新成功", "供应商验证失败", "尝试执行"] }
  ];

  let state = initialState();
  let activeScenario = 0;
  let stepIndex = 0;

  function dispatch(action) { state = reduce(state, action); render(); }

  function render() {
    const fields = [
      ["缓存", state.cache], ["远端", state.remote], ["供应商验证", state.validation],
      ["缓存年龄", state.ageDays === null ? "无" : `${state.ageDays} 天`], ["允许执行", state.executable ? "是" : "否"], ["最近事件", state.lastEvent]
    ];
    document.querySelector("#state").innerHTML = fields.map(([label, value]) => `<div class="field"><span class="label">${label}</span><span class="value">${value}</span></div>`).join("");
    document.querySelector("#notice").textContent = state.executable ? "当前 profile 可以向目标子进程注入密钥。" : "当前 profile 失败关闭，不会向目标子进程注入密钥。";
    document.querySelector("#actions").innerHTML = actionNames.map(name => `<button class="${name === "刷新成功" ? "primary" : ""}" data-action="${name}">${name}</button>`).join("");
    document.querySelectorAll("[data-action]").forEach(button => button.addEventListener("click", () => dispatch(button.dataset.action)));

    document.querySelector("#tabs").innerHTML = scenarios.map((scenario, index) => `<button class="${index === activeScenario ? "active" : ""}" data-tab="${index}">${scenario.name}</button>`).join("");
    document.querySelectorAll("[data-tab]").forEach(button => button.addEventListener("click", () => { activeScenario = Number(button.dataset.tab); stepIndex = 0; state = initialState(); render(); }));
    const scenario = scenarios[activeScenario];
    document.querySelector("#scenario-description").textContent = scenario.description;
    document.querySelector("#steps").innerHTML = scenario.steps.map((name, index) => `<li><button data-step="${index}" ${index !== stepIndex ? "disabled" : ""}>${name}</button></li>`).join("");
    document.querySelectorAll("[data-step]").forEach(button => button.addEventListener("click", () => { dispatch(scenario.steps[stepIndex]); stepIndex += 1; render(); }));
  }
  render();
</script>
</body>
</html>
